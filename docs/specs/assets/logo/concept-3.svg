<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 357.33 100.08" width="1072" height="300.24" role="img" aria-labelledby="t3">
<title id="t3">Groos Personeelsdiensten, logoconcept 3 Samen</title>
<desc>Concept 3 Samen (aanbevolen): woordmerk groos waarin de twee o's een gedeelde stam hebben; de oo is ook het losse beeldmerk en de tegel. Kleuren: merkblauw #2741C9, inkt #0B0F2E, beschrijver #4B5170. Woordmerk uit Instrument Sans (OFL), gewicht 640, breedte 100, spatiëring -0,012 em, omgezet naar contouren. Beschrijver uit Onest Medium, spatiëring 0,045 em. Spec 02.</desc>
